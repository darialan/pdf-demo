<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">Web Printer 分层架构</title>
  <desc id="arch-desc">五层模块：接入层、应用层、输出层、适配层与内核。左侧竖线表示依赖方向，上层可以依赖任意下层，内核不依赖上层。</desc>

  <rect width="1200" height="540" fill="#f6f7f4"/>

  <text x="60" y="42" fill="#6f7a72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="1.4">MODULE LAYERS</text>
  <text x="1140" y="42" fill="#6f7a72" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">依赖方向 ↓</text>

  <!-- core highlight -->
  <rect x="60" y="376" width="1080" height="76" fill="#edf4ef"/>

  <!-- row dividers -->
  <g stroke="#dde3dd">
    <path d="M60 148h1080"/>
    <path d="M60 224h1080"/>
    <path d="M60 300h1080"/>
    <path d="M60 376h1080"/>
    <path d="M60 452h1080"/>
  </g>

  <!-- dependency rail -->
  <path d="M84 80v358" stroke="#32745d" stroke-width="1.5"/>
  <polygon points="84,448 79,438 89,438" fill="#32745d"/>
  <g fill="#32745d">
    <circle cx="84" cy="110" r="3.5"/>
    <circle cx="84" cy="186" r="3.5"/>
    <circle cx="84" cy="262" r="3.5"/>
    <circle cx="84" cy="338" r="3.5"/>
    <circle cx="84" cy="414" r="3.5"/>
  </g>

  <!-- 01 access -->
  <text x="120" y="108" fill="#202321" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="26" font-weight="700">接入层</text>
  <text x="120" y="130" fill="#6f7a72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">ACCESS</text>
  <text x="420" y="112" fill="#3d453f" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="19">React 集成　·　　可视化调试</text>

  <!-- 02 application -->
  <text x="120" y="184" fill="#202321" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="26" font-weight="700">应用层</text>
  <text x="120" y="206" fill="#6f7a72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">APPLICATION</text>
  <text x="420" y="188" fill="#3d453f" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="19">布局编排　·　　导出会话　·　　取消控制</text>

  <!-- 03 output -->
  <text x="120" y="260" fill="#202321" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="26" font-weight="700">输出层</text>
  <text x="120" y="282" fill="#6f7a72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">OUTPUT</text>
  <text x="420" y="264" fill="#3d453f" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="19">PDF 组装　·　　逐页 PNG　·　　ZIP 打包</text>

  <!-- 04 adapters -->
  <text x="120" y="336" fill="#202321" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="26" font-weight="700">适配层</text>
  <text x="120" y="358" fill="#6f7a72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">ADAPTERS</text>
  <text x="420" y="340" fill="#3d453f" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="19">DOM 测量　·　　样式快照　·　　Canvas 截图　·　　PDF 引擎</text>

  <!-- 05 core -->
  <text x="120" y="412" fill="#244c3a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="26" font-weight="700">内核</text>
  <text x="120" y="434" fill="#4f6b5c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">CORE</text>
  <text x="420" y="416" fill="#244c3a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="19">纸张几何　·　　保护规则　·　　分页算法</text>

  <text x="120" y="500" fill="#6f7a72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="15">上层可以依赖任意下层；core 为纯计算，不依赖 DOM、React 或第三方库。</text>
</svg>
